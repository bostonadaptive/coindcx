{% extends "base_app.html" %}
{% block breadcrumb %}
  <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
  <li class="breadcrumb-item active">Overview</li>
{% endblock %}
{% block content %}

<div class="row g-3">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body" id="tradingview_chart"></div>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="card mb-3">
      <div class="card-body" id="broker-box">
        <!-- Filled by JS (refreshBalance) -->
        <div class="text-muted">Loading broker status…</div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <ul class="nav nav-tabs" id="posTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="active-tab" data-bs-toggle="tab" data-bs-target="#active"
                    type="button" role="tab" aria-controls="active" aria-selected="true">
              Active Positions
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="watchlist-tab" data-bs-toggle="tab" data-bs-target="#watchlist"
                    type="button" role="tab" aria-controls="watchlist" aria-selected="false">
              Watchlist
            </button>
          </li>
          <li class="nav-item ms-auto" role="presentation">
            <button class="btn btn-sm btn-outline-light" id="refreshPositionsBtn" type="button" title="View History">
              <a href="{{ url_for('trade_history') }}" class="refresh-btn"><i class="bi bi-arrow-clockwise"></i></a>
            </button></li>
        </ul>

        <div class="tab-content pt-3">
          <div class="tab-pane fade show active" id="active" role="tabpanel" aria-labelledby="active-tab">
            <div id="positions-container" class="list-group small">
              <p class="text-muted">Loading positions…</p>
            </div>
          </div>

          <div class="tab-pane fade" id="watchlist" role="tabpanel" aria-labelledby="watchlist-tab">
            <div class="mb-2">
              <input class="form-control" id="symbolSearch" placeholder="Search instruments… (e.g., ETHUSDT)"/>
              <ul class="list-group" id="suggestions"></ul>
            </div>
            <div id="watchlist-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Broker Modal -->
<div class="modal fade" id="brokerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" method="post" action="{{ url_for('update_api') }}">
      <div class="modal-header">
        <h5 class="modal-title">API Credentials</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Email</label>
          <input name="email" class="form-control" required value="{{ creds.email if creds else '' }}">
        </div>
        <div class="mb-2">
          <label class="form-label">Mobile</label>
          <input name="mobile" class="form-control" required value="{{ creds.mobile if creds else '' }}">
        </div>
        <div class="mb-2">
          <label class="form-label">API Key</label>
          <input name="api_key" class="form-control" required value="{{ creds.api_key if creds else '' }}">
        </div>
        <div class="mb-2">
          <label class="form-label">Secret Key</label>
          <input name="secret_key" class="form-control" required value="{{ creds.secret_key if creds else '' }}">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function(){
  // --- LocalStorage keys ---
  const POS_KEY = 'cached_positions';
  const BAL_KEY = 'cached_balance';

  function renderPositionsList(open){
    const container = document.getElementById('positions-container');
    if (!container) return;
    if (!open || !open.length){ container.innerHTML = '<p class="text-muted">No open positions</p>'; return; }
    let html = '';
    open.forEach(p=>{
      const pnl = (p.pnl_open_inr_value !== undefined && p.pnl_open_inr_value !== null) ? Number(p.pnl_open_inr_value) : (p.unrealized_pnl || 0);
      const cls = Number(pnl) < 0 ? 'text-danger' : 'text-success';
      function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\'/g,"&#39;"); }
      function reasonSpan(s){ if(!s) return ''; const full=esc(s); const short = full.length>30? full.slice(0,30)+'...': full; return `<div><small class="text-muted" title="${full}" data-bs-toggle="tooltip">${short}</small></div>`; }
      const pairLabel = p.pair || p.tv_symbol || '';
      let ltp = '-';
      html += `<div class="list-group-item d-flex justify-content-between align-items-center">`+
        `<div><strong>${p.pair || tvToCoindcxPair(p.tv_symbol) || p.tv_symbol || ''}</strong>${reasonSpan(p.entry_reason)}<br><small class="text-muted">${p.side||''} • Qty: ${p.qty||''}</small></div>`+
        `<div class="text-end"><div class="fw-bold ${cls}">₹${Number(pnl||0).toFixed(2)}</div><div class="small text-muted">LTP: <span data-label="${pairLabel}">-</span></div></div>`+
        `</div>`;
    });
    container.innerHTML = html;
    try{ var t = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]')); t.map(function(el){ return new bootstrap.Tooltip(el); }); }catch(e){}
  }

  function renderBrokerBox(wallet){
    const box = document.getElementById('broker-box');
    if (!box) return;
    box.innerHTML = `<div><strong>Balance:</strong> ₹${wallet.balance || '-'}<br><small class="text-muted">${wallet.status || ''}</small></div>`;
  }

  // --- Display cached data immediately ---
  try {
    const cachedPos = localStorage.getItem(POS_KEY);
    if (cachedPos) {
      const js = JSON.parse(cachedPos);
      renderPositionsList(js.open || []);
    }
  } catch(e){}
  try {
    const cachedBal = localStorage.getItem(BAL_KEY);
    if (cachedBal) {
      const js = JSON.parse(cachedBal);
      renderBrokerBox(js);
    }
  } catch(e){}

  // --- Poll for updates ---
  function pollPositions(){
    fetch('/get_positions').then(r=>r.json()).then(js=>{
      renderPositionsList(js.open || []);
      localStorage.setItem(POS_KEY, JSON.stringify(js));
    }).catch(()=>{});
  }
  function pollBalance(){
    fetch('/get_real_wallet').then(r=>r.json()).then(js=>{
      renderBrokerBox(js);
      localStorage.setItem(BAL_KEY, JSON.stringify(js));
    }).catch(()=>{});
  }
  pollPositions(); pollBalance();
  setInterval(pollPositions, 7000); // every 7 seconds
  setInterval(pollBalance, 15000); // every 15 seconds
});
</script>
{% endblock %}
