{% extends "base_auth.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-center vh-100" 
     style="background: url('{{ url_for('static', filename='img/bg1.png') }}') center center / cover no-repeat fixed; height: 100vh; overflow: hidden;">
  <div class="card shadow-lg border-0 rounded-4 p-4 animate__animated animate__fadeInDown" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center mb-4 text-primary fw-bold">Reset Your Password</h3>

      <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control rounded-3" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <input type="password" class="form-control rounded-3" id="new_password" name="new_password" required>
        </div>

        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" class="form-control rounded-3" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-3 shadow-sm">Reset Password</button>
      </form>

      <p class="mt-3 text-center">
        Remember your password?
        <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary">Login</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
