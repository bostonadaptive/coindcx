{% extends "base_auth.html" %}
{% block title %}Signup{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-center vh-100" 
     style="background: url('{{ url_for('static', filename='img/bg1.png') }}') center center / cover no-repeat fixed; height: 100vh; overflow: hidden;">
  <div class="card shadow-lg border-0 rounded-4 p-4 animate__animated animate__fadeInUp" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center mb-4 text-success fw-bold">Create Account</h3>

      <form method="POST" action="{{ url_for('signup') }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control rounded-3" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control rounded-3" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-success w-100 rounded-3 shadow-sm">Sign Up</button>
      </form>

      <p class="mt-3 text-center">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-success">Login</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
