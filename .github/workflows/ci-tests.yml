name: CI - Tests

on:
  push:
    branches: [ feat/fastapi-adapters, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
      - name: Run tests with ASGI test helpers enabled
        env:
          ASGI_ENABLE_TEST_HELPERS: '1'
        run: |
          pytest -q
