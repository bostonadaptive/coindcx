<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CoinDCX App</a>
      <div class="ms-auto">
        <a class="nav-link d-inline text-white-50" href="/login">Login</a>
        <a class="nav-link d-inline text-white-50" href="/signup">Signup</a>
      </div>
    </div>
  </nav>

  

<div class="d-flex align-items-center justify-content-center vh-100" 
     style="background: url('/static/img/bg1.png') center center / cover no-repeat fixed; height: 100vh; overflow: hidden;">
  <div class="card shadow-lg border-0 rounded-4 p-4 animate__animated animate__fadeInDown" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center mb-4 text-primary fw-bold">Welcome Back</h3>

      <form method="POST" action="/login">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control rounded-3" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control rounded-3" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-3 shadow-sm">Login</button>
      </form>

      <p class="mt-3 text-center">
        Don’t have an account?
        <a href="/signup" class="text-decoration-none fw-bold text-primary">Sign up</a>
      </p>

      <p class="mt-2 text-center">
        <a href="/forgot_password" class="text-decoration-none fw-bold text-primary">Forgot Password?</a>
      </p>
    </div>
  </div>
</div>



  
    
  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
